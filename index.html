    if (!S.datos.admin && !esApp() && !D.pasado) h += `<a href="#" id="instalar" style="text-align:center;font-size:14px;font-weight:600;padding:6px">Ponerla como app en el móvil</a>`;
  } else if (tab === "Horario") {
    h += PV ? horarioVista(PV, D0) : `<div class="gris" style="padding:12px">Solo en el curso actual.</div>`;
  } else if (tab === "Clases") {
    h += `<div class="card" style="flex-direction:row;align-items:center;gap:12px"><div style="flex-grow:1"><div class="tit">ASISTENCIA${per === "Todos" ? (varios ? " · TODOS" : "") : " · " + esc(per.toUpperCase())}</div><div class="gris" style="font-size:14px">${fmt(el.dadas)} ${el.dadas === 1 ? "clase dada" : "clases dadas"} · ${el.netas} ${el.netas === 1 ? "falta" : "faltas"} sin recuperar</div></div><div style="font-size:40px;font-weight:750;color:#1D4F78;line-height:1;white-space:nowrap">${pct(el.dadas, el.netas)}</div></div>`;
    if (PV) h += PREV + resumenFaltas(el);
    h += `<div class="card" style="gap:0"><div class="tit" style="padding-bottom:6px">MES A MES${PV ? " · PULSA UN MES" : ""}</div>` + (el.meses.length ? el.meses.map(m => { const v = m[1] + m[2] > 0 ? Math.round(100 * m[1] / (m[1] + m[2])) : 0;
      const cuerpo = `<div style="display:flex;align-items:baseline"><span style="font-size:16px;font-weight:650;flex-grow:1">${esc(m[0])}${PV ? ` <span style="color:#6B7780;font-weight:400">${S.mesAb === m[0] ? "⌄" : "›"}</span>` : ""}</span><span style="font-size:16px;font-weight:750;color:#1D4F78">${pct(m[1], m[2])}</span></div><div class="barra"><div style="width:${v}%"></div></div><div class="d">${fmt(m[1])} ${m[1] === 1 ? "clase dada" : "clases dadas"} · ${m[2]} ${m[2] === 1 ? "falta" : "faltas"}</div>`;
      return `<div class="lin" style="flex-direction:column;align-items:stretch;gap:6px">${PV ? `<button type="button" class="mesb" data-mes="${esc(m[0])}">${cuerpo}</button>` + (S.mesAb === m[0] ? calendarioMes(PV, m[0], D.curso, per) : "") : cuerpo}</div>`; }).join("") : `<div class="gris">Aún no hay clases este curso.</div>`) + `</div>`;
  } else if (tab === "Faltas") {
    h += pintarFaltas(el);
  } else if (tab === "Partidos" && verParT && S.parModo === "q") {
    h += pintarQuedar();
  } else if (tab === "Partidos" && verParT) {
    if (S.datos.admin && !S.parEd) h += `<div class="aviso" style="font-size:14px">Prueba: lo que apuntes aquí son <b>tus</b> partidos (los de cada alumno solo están en su móvil y tú no los ves).</div>`;
    h += pintarPartidos(Dp, variosP && Dp.personas.some(p => p.nombre === per) ? per : "Todos", variosP);
  } else if (tab === "Evolucion") {
    h += D0.evo ? pintarEvolucion(D, D0.evo, per, varios) : `<div class="gris" style="padding:12px">Sin puntuaciones.</div>`;
  } else {
    if (D.pasado && !debe) h += `<div class="estado" style="background:#DDEFE3;border:1px solid #B9DCC4;color:#22603A"><div style="flex-grow:1"><div style="font-size:17px;font-weight:700">${P.total && P.total !== "0 €" ? "Pagado en el curso " + esc(D.curso) : "Curso " + esc(D.curso)}</div><div style="font-size:13.5px">${P.total && P.total !== "0 €" ? "Nada pendiente" : "No tengo apuntados los pagos de este curso"}</div></div><div style="font-size:22px;font-weight:750;white-space:nowrap">${P.total && P.total !== "0 €" ? esc(P.total) : ""}</div></div>`;
    else if (!debe && D.esteMes && D.esteMes.listo) h += `<div class="estado" style="background:#FFF1DC;border:1px solid #F0C98A;color:#8A4B00"><div style="flex-grow:1"><div style="font-size:17px;font-weight:700">Ya puedes pagar ${esc(D.esteMes.mes.toLowerCase())}</div><div style="font-size:13.5px">${esc(P.quien || "Ya no quedan clases este mes")}</div></div><div style="font-size:22px;font-weight:750;white-space:nowrap">${esc(D.esteMes.imp)}</div></div>`;   // (v3.02)
    else h += `<div class="estado" style="${debe ? "background:#FBE3E3;border:1px solid #EBB4B4;color:#9E2B2B" : "background:#DDEFE3;border:1px solid #B9DCC4;color:#22603A"}"><div style="flex-grow:1"><div style="font-size:17px;font-weight:700">${debe ? "Tienes pendiente" : "Estás al día"}</div><div style="font-size:13.5px">${esc(debe ? P.pend.map(x => x.mes).join(", ") : (P.quien || ""))}</div></div><div style="font-size:22px;font-weight:750;white-space:nowrap">${debe ? esc(P.debe) : ""}</div></div>`;
    if (debe && P.quien) h += `<div class="gris" style="font-size:13.5px;padding:0 4px">${esc(P.quien)}</div>`;
    if (debe) h += `<div class="card" style="gap:0;padding-top:4px;padding-bottom:4px"><div class="tit" style="color:#9E2B2B;padding:10px 0 4px">SIN PAGAR</div>` + P.pend.map(x => `<div class="lin"><div class="x"><div class="n">${esc(x.mes)}</div><div class="d">${esc(x.det)}</div></div><span class="chip c-debe">${esc(x.imp)}</span></div>`).join("") + `</div>`;
    if (D.esteMes) h += `<div class="card" style="gap:6px"><div class="tit">${D.esteMes.listo ? (debe ? "ESTE MES · A PAGAR" : "DETALLE DE " + esc(D.esteMes.mes.toUpperCase())) : "ESTE MES · HASTA HOY"}</div><div style="display:flex;align-items:center"><div style="flex-grow:1"><div class="n" style="font-size:15.5px;font-weight:600">${esc(D.esteMes.mes)}</div><div class="d gris" style="font-size:13px">${esc(D.esteMes.det)}${D.esteMes.listo ? " · ya está completo" : ""}</div></div>${D.esteMes.listo && !debe ? "" : `<div style="font-size:19px;font-weight:750;white-space:nowrap${D.esteMes.listo ? ";color:#9E2B2B" : ""}">${esc(D.esteMes.imp)}</div>`}</div>${D.esteMes.aviso ? `<div class="avisoMes">⚠ ${esc(D.esteMes.aviso)}</div>` : ""}`
      + (D.esteMes.desglose || []).map(x => `<div style="display:flex;gap:8px;font-size:13.5px" class="gris"><div style="flex-grow:1">${esc(x[0])}</div><div style="white-space:nowrap">${esc(x[1])}</div></div>`).join("") + `</div>`;
    h += `<div class="card" style="gap:0;padding-top:4px;padding-bottom:4px"><div class="tit" style="padding:10px 0 4px">MESES PAGADOS</div>` + (P.pagados.length ? P.pagados.map(x => `<div class="lin"><div class="x"><div class="n">${esc(x.mes)}</div><div class="d">${esc(x.det)}</div></div><span class="chip c-ok">✓ ${esc(x.imp)}</span></div>`).join("") : `<div class="gris" style="padding:10px 0">${D.pasado ? "Sin datos de pagos de este curso." : "Todavía ninguno este curso."}</div>`) + `</div>`;
  }
  // «Partidos»: los alumnos, si Alain la ha activado; Alain la ve siempre (son sus partidos de prueba, no los del alumno)
  const verPar = verParT;
  // (19/11/2026, Alain) Pagos a la derecha del todo y Partidos en su sitio
  const pestanas = (PV ? ["Inicio", "Horario", "Clases"] : ["Inicio", "Clases", "Faltas"]).concat(verPar ? ["Partidos"] : [], ["Pagos"]);
  h += `</main><nav class="nav" style="grid-template-columns:repeat(${pestanas.length},1fr)">` + pestanas.map(n => `<button data-tab="${n}" class="${n === tab ? "on" : ""}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg><span>${n}</span></button>`).join("") + `</nav>`;
  $app.innerHTML = h;
  $app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if (b.dataset.tab !== S.tab) { S.parBusca = ""; S.parVista = null; S.parVer = null; S.qVer = null; S.qEd = null; } const cp = document.getElementById("capaPar"); if (cp) cp.remove(); S.tab = b.dataset.tab; S.parEd = null; contarPest(S.tab); pintar(); window.scrollTo(0, 0); });
  $app.querySelectorAll("[data-per]").forEach(b => b.onclick = () => { S.per = b.dataset.per; pintar(); });
  $app.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { S.per = b.dataset.ver; S.tab = "Clases"; pintar(); window.scrollTo(0, 0); });
  const sal = document.getElementById("salir"); if (sal) sal.onclick = ev => { ev.preventDefault(); salir(); };
  $app.querySelectorAll("[data-evo]").forEach(b => b.onclick = () => { S.tab = "Evolucion"; S.evoSel = null; contarPest("Evolución"); pintar(); window.scrollTo(0, 0); });
  $app.querySelectorAll("[data-evoper]").forEach(b => b.onclick = () => { S.evoPer = b.dataset.evoper; S.evoSel = null; S.per = "Todos"; pintar(); });
  $app.querySelectorAll("[data-evosel]").forEach(b => b.onclick = () => { S.evoSel = +b.dataset.evosel; pintar(); });
  $app.querySelectorAll("[data-evocat]").forEach(b => b.onclick = () => { const k = b.dataset.evocat; S.evoAbiertas[k] = !S.evoAbiertas[k]; pintar(); });
  $app.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => { S.mesAb = S.mesAb === b.dataset.mes ? null : b.dataset.mes; pintar(); });
  $app.querySelectorAll("[data-hv]").forEach(b => b.onclick = () => { S.hVista = b.dataset.hv; try { localStorage.setItem("gd_hvista", S.hVista); } catch (e) { } pintar(); });
  $app.querySelectorAll("[data-cald]").forEach(b => b.onclick = () => { S.calSel = b.dataset.cald; pintar(); });   // (19/11/2026) Horario en calendario
  $app.querySelectorAll("[data-calm]").forEach(b => b.onclick = () => { if (b.dataset.calm) { S.calMes = b.dataset.calm; pintar(); } });
  $app.querySelectorAll("[data-fexp]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const k = b.dataset.fexp.split("|"); hojaFexp(k[0], k[1]); });   // (18/11/2026) explicar una falta
  const sc = document.getElementById("selcurso"); if (sc) sc.onchange = () => { S.ci = +sc.value; S.mesAb = null; contarPest("Cursos anteriores"); pintar(); window.scrollTo(0, 0); };
  const vol = document.getElementById("volver"); if (vol) vol.onclick = () => { S.ci = 0; S.mesAb = null; S.cuenta = -1; S.tab = "Inicio"; S.per = "Todos"; pintar(); window.scrollTo(0, 0); };
  const ins = document.getElementById("instalar"); if (ins) ins.onclick = ev => { ev.preventDefault(); verInstalar(true); };
  $app.querySelectorAll("[data-pmodo]").forEach(b => b.onclick = () => { if (S.parModo === b.dataset.pmodo) return; S.parModo = b.dataset.pmodo; S.qVer = null; S.qEd = null; S.parVista = null; S.parVer = null; S.parBusca = ""; contarPest(S.parModo === "q" ? "Quedar para jugar" : "Partidos"); pintar(); window.scrollTo(0, 0); });
  if (tab === "Partidos") { if (S.parModo === "q") enlazarQuedar(Dp, variosP); else enlazarPartidos(Dp, variosP); }
  enlazarAvisos();
}
// vista de Alain: la lista de todas las cuentas; al pulsar una, se ve exactamente como la ve el alumno
function pintarAdmin() {
  const L = S.datos.cuentas;
  $app.innerHTML = `<header class="cab"><div class="fila"><div style="flex-grow:1"><h1>Todos los alumnos</h1><div class="sub">Vista de ${esc(S.datos.saludo)} · actualizado el ${esc(S.datos.actualizado)}</div></div>${avisosActivos() ? botonCampana(false) : ""}<button class="salir" id="salir">Cerrar sesión</button></div></header>
<main class="cuerpo" style="padding-bottom:24px">${franjaMudanza()}${bloqueAvisos()}<div class="card" style="gap:0"><div class="tit" style="padding-bottom:4px">${L.length} CUENTAS · PULSA PARA VER LO QUE VE CADA UNO</div>`
    + L.map((c, i) => { const a = agg(c, c.personas, c.personas.length > 1); const debe = c.pagos.pend.length > 0;
      return `<button class="persona" data-cuenta="${i}"><span style="flex-grow:1"><span style="display:block;font-size:16px;font-weight:650">${esc(c.titulo)}</span><span class="gris" style="font-size:12.5px">${esc(c.etiqueta || "")}</span></span><span class="chip ${debe ? "c-debe" : "c-rec"}">${debe ? esc(c.pagos.debe) : "al día"}</span><span style="font-size:16px;font-weight:750;color:#1D4F78;width:52px;text-align:right">${pct(a.dadas, a.netas)}</span></button>`; }).join("")
    + `</div>${esApp() ? "" : `<a href="#" id="instalar" style="text-align:center;font-size:14px;font-weight:600;padding:6px">Ponerla como app en el móvil</a>`}</main>`;
  $app.querySelectorAll("[data-cuenta]").forEach(b => b.onclick = () => { S.ci = 0; S.mesAb = null; S.cuenta = +b.dataset.cuenta; S.tab = "Inicio"; S.per = "Todos"; pintar(); window.scrollTo(0, 0); });
  document.getElementById("salir").onclick = ev => { ev.preventDefault(); salir(); };
  const ins = document.getElementById("instalar"); if (ins) ins.onclick = ev => { ev.preventDefault(); verInstalar(true); };
  enlazarAvisos();
}
function salir() {
  const capa = document.createElement("div"); capa.className = "capa";
  capa.innerHTML = `<div class="hoja"><div style="font-size:20px;font-weight:700">¿Cerrar sesión?</div><div class="gris" style="font-size:15px;line-height:1.45">Solo hace falta si este móvil no es tuyo. Para cerrar la app, ciérrala como cualquier otra: la próxima vez entrarás directamente. Si cierras la sesión, tendrás que escribir otra vez tu contraseña.</div><button class="boton" id="siSalir">Cerrar sesión</button><button class="boton2" id="noSalir">Cancelar</button></div>`;
  document.body.appendChild(capa);
  const quitar = () => capa.remove();
  capa.onclick = e => { if (e.target === capa) quitar(); };
  document.getElementById("noSalir").onclick = quitar;
  document.getElementById("siSalir").onclick = () => {
    quitar(); ls.del("gd_sesion");
    const id = S.id, ficha = S.ficha, conClave = !!(ficha && (ficha.modo === "clave" || ls.get("gd_pendiente_" + id)));
    S = { pantalla: conClave ? "clave" : "entrar", tab: "Inicio", per: "Todos", ficha: conClave ? ficha : null, id: conClave ? id : null, llave: null, datos: null, cuenta: -1, error: "" };
    pintar();
  };
}
function pintar() {
  if (S.pantalla === "entrar") pintarEntrar(); else if (S.pantalla === "clave") pintarClave(); else if (S.pantalla === "nueva") pintarNueva(); else pintarApp();
  if (S.pantalla === "app" && !ls.get("gd_instalar_visto") && !esApp()) { ls.set("gd_instalar_visto", 1); setTimeout(() => verInstalar(false), 600); }
}

// ---------- ponerla como app ----------
let avisoInstalar = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); avisoInstalar = e; });
const esApp = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const esIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function verInstalar(pedido) {
  if (esApp()) return;
  const ios = esIOS();
  if (!ios && !avisoInstalar && !pedido) return;
  const capa = document.createElement("div"); capa.className = "capa";
  const flecha = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4F78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="icono Compartir" style="vertical-align:-4px"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>`;
  capa.innerHTML = `<div class="hoja"><div style="font-size:20px;font-weight:700">Ponla como app</div><div class="gris" style="font-size:14px">Así la tienes en la pantalla de inicio, con su icono.</div>`
    + (ios ? `<div class="paso"><b class="num">1</b><div>Abajo, en Safari, pulsa <b>Compartir</b> ${flecha}</div></div><div class="paso"><b class="num">2</b><div>Baja y pulsa <b>«Añadir a pantalla de inicio»</b></div></div><div class="paso"><b class="num">3</b><div>Pulsa <b>«Añadir»</b> arriba a la derecha. Ya está.</div></div>`
      : avisoInstalar ? `<button class="boton" id="inst" style="background:#2F7D4F">Instalar</button>` : `<div class="paso"><b class="num">1</b><div>Abre el menú del navegador (los tres puntos) y pulsa <b>«Instalar aplicación»</b> o <b>«Añadir a pantalla de inicio»</b>.</div></div>`)
    + `<button class="boton2" id="cerrarI">Ahora no</button></div>`;
  document.body.appendChild(capa);
  const quitar = () => capa.remove();
  capa.onclick = e => { if (e.target === capa) quitar(); };
  document.getElementById("cerrarI").onclick = quitar;
  const bi = document.getElementById("inst"); if (bi) bi.onclick = async () => { avisoInstalar.prompt(); try { await avisoInstalar.userChoice; } catch (e) {} avisoInstalar = null; quitar(); };
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
inicio();
</script>
