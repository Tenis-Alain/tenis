<body>
<div id="app"><div class="cargando">Cargando…</div></div>
<!-- buzón: aquí deja la página la llave envuelta con la contraseña nueva (nunca la contraseña). Lo recoge el programa de Alain. -->
<form name="buzon" method="POST" data-netlify="true" netlify-honeypot="campo-trampa" hidden>
<input name="campo-trampa"><input name="id"><input name="sal"><input name="iter"><input name="sobre"><input name="prueba">
</form>
<script>
"use strict";
const ITER_NUEVA = 150000;
const DATOS = "";   // de dónde se leen los datos ("" = de aquí mismo: GitHub Pages)
const BUZON = "https://tenis-alain.netlify.app/";   // a dónde se manda el sobre de la contraseña nueva (el buzón de Netlify; "" = aquí mismo)
const MESES_CORTOS = ["Sep", "Oct", "Nov", "Dic", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago"];
const $app = document.getElementById("app");
const enc = new TextEncoder(), dec = new TextDecoder();
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

// ---------- cifrado: PBKDF2-SHA256 + AES-256-CBC + HMAC-SHA256 (igual que el programa) ----------
const b64 = { de(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },
  a(u) { let s = ""; u = new Uint8Array(u); for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); } };
const cat = (a, b) => { const u = new Uint8Array(a.length + b.length); u.set(a, 0); u.set(b, a.length); return u; };
async function derivar(secreto, salB64, iter) {
  const base = await crypto.subtle.importKey("raw", enc.encode(secreto), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64.de(salB64), iterations: iter }, base, 512));
}
async function hmac(clave32, datos) {
  const k = await crypto.subtle.importKey("raw", clave32, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", k, datos));
}
function iguales(a, b) { if (a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i]; return d === 0; }
async function abrir(caja, llave64) {
  const iv = b64.de(caja.iv), ct = b64.de(caja.ct);
  const m = await hmac(llave64.slice(32, 64), cat(iv, ct));
  if (!iguales(m, b64.de(caja.mac))) throw new Error("llave");
  const k = await crypto.subtle.importKey("raw", llave64.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, k, ct));
}
async function cerrar(datos, llave64) {
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const k = await crypto.subtle.importKey("raw", llave64.slice(0, 32), "AES-CBC", false, ["encrypt"]);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-CBC", iv }, k, datos));
  return { iv: b64.a(iv), ct: b64.a(ct), mac: b64.a(await hmac(llave64.slice(32, 64), cat(iv, ct))) };
}
// el teléfono: solo sus 8 últimas cifras (vale con o sin prefijo, con espacios o sin ellos)
const tel8 = s => { const d = String(s || "").replace(/\D/g, ""); return d.length >= 8 ? d.slice(-8) : ""; };
async function idDe(t8) { const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("gd-id|" + t8))); return Array.from(h).map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 24); }
// (3/11/2026) la versión de esta página. Los datos dicen cuál es la última: si esta es más vieja (GitHub tarda unos minutos
// en dejar de dar la copia guardada), se vuelve a abrir pidiendo la nueva. Una sola vez por versión, para no dar vueltas.
const PAGVER = "g4GwHd5eaWYv";
function paginaVieja(f) {
  try {
    if (!f || !f.pag || PAGVER.indexOf("__") === 0 || f.pag === PAGVER) return false;
    if (sessionStorage.getItem("gd_pv") === f.pag) return false;
    sessionStorage.setItem("gd_pv", f.pag); location.replace(location.pathname + "?v=" + f.pag); return true;
  } catch (e) { return false; }
}
async function leerFicha(id, mirarVersion) {
  const r = await fetch((DATOS ? DATOS + "/" : "") + "datos/" + id + ".json?v=" + Date.now(), { cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("red (HTTP " + r.status + ")");
  const j = await r.json();
  if (mirarVersion && paginaVieja(j)) await new Promise(() => {});   // se está recargando
  return j;
}

// ---------- estado ----------
let S = { pantalla: "entrar", tab: "Inicio", per: "Todos", ficha: null, id: null, llave: null, datos: null, cuenta: -1, error: "" };
function guardarSesion(recordar) { if (recordar) ls.set("gd_sesion", { id: S.id, k: b64.a(S.llave) }); }
async function abrirDatos() {
  const bytes = await abrir(S.ficha.datos, S.llave);
  S.datos = JSON.parse(dec.decode(bytes)); S.cargado = Date.now();
}
// al volver a la app (estaba en segundo plano): si ha pasado más de un minuto, trae los datos nuevos sin que se note.
// Se queda en la misma pestaña y persona; si algo falla, sigue con lo que había.
let refrescando = false;
async function refrescar() {
  if (refrescando || S.pantalla !== "app" || !S.id || !S.llave || Date.now() - (S.cargado || 0) < 60000) return;
  refrescando = true;
  try {
    const f = await leerFicha(S.id, true); if (!f) return;
    const nuevos = JSON.parse(dec.decode(await abrir(f.datos, S.llave)));
    S.ficha = f; S.cargado = Date.now();
    if (JSON.stringify(nuevos) !== JSON.stringify(S.datos)) { S.datos = nuevos; if (nuevos.admin && S.cuenta >= (nuevos.cuentas || []).length) S.cuenta = -1; const y = window.scrollY; pintar(); window.scrollTo(0, y); }
  } catch (e) { } finally { refrescando = false; }
}

async function inicio() {
  if (!window.crypto || !crypto.subtle) { $app.innerHTML = '<div class="cargando">Abre esta página en Safari o Chrome (con https).</div>'; return; }
  const ses = ls.get("gd_sesion");
  if (ses && ses.id && ses.k) {
    try {
      const f = await leerFicha(ses.id, true);
      if (f) { S.ficha = f; S.id = ses.id; S.llave = b64.de(ses.k); await abrirDatos(); S.pantalla = "app"; await reintentarBuzon(); pintar(); return; }
    } catch (e) { if (String(e.message) === "red") { S.error = "No hay conexión. Prueba otra vez en un momento."; } }
    ls.del("gd_sesion");
  }
  S.pantalla = "entrar"; pintar();
}

// ---------- pantallas de entrada ----------
function pintarEntrar() {
  $app.innerHTML = `<div class="portada">
<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#C6D82A"/><path d="M8 22 C 26 30, 26 42, 8 50" fill="none" stroke="#fff" stroke-width="4"/><path d="M64 22 C 46 30, 46 42, 64 50" fill="none" stroke="#fff" stroke-width="4"/></svg>
<h1>${esc(document.title)}</h1><div style="color:#D6E3EE">Tus clases, tus faltas y tus pagos</div></div>
<form class="form" id="f"><div class="card" style="gap:12px">
<label for="tel">Escribe tu teléfono</label>
<div class="gris" style="font-size:14px;line-height:1.45">El mismo que tiene Alain apuntado. Si son tus hijos los que dan clase, el tuyo.</div>
<input id="tel" type="tel" inputmode="numeric" autocomplete="tel" required>
${S.error ? `<div class="error">${esc(S.error)}</div>` : ""}
<button class="boton" type="submit">Entrar</button></div>
<div class="gris" style="font-size:13px;text-align:center;line-height:1.5">Solo puedes ver lo tuyo. Nadie más (ni siquiera la web donde está esta página) puede leer tus datos.</div></form>`;
  const ut = ls.get("gd_ultimo_tel"); if (ut && typeof ut === "string") document.getElementById("tel").value = ut;
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault(); const telEscrito = document.getElementById("tel").value, t8 = tel8(telEscrito);
    if (!t8) { S.error = "Ese teléfono no parece completo."; pintar(); return; }
    espera("Buscando…");
    let paso = "buscar";
    try {
      S.id = await idDe(t8); paso = "descargar"; const f = await leerFicha(S.id);
      if (!f) { S.error = "Ese teléfono no está en la lista. Escríbelo como lo tiene Alain, o pregúntale."; S.pantalla = "entrar"; pintar(); return; }
      S.ficha = f; S.error = ""; ls.set("gd_ultimo_tel", telEscrito.trim());
      const pend = ls.get("gd_pendiente_" + S.id);
      if (f.modo === "clave" || pend) { S.pantalla = "clave"; pintar(); return; }
      paso = "llave"; const kek = await derivar(t8, f.sal, f.iter);
      paso = "sobre"; S.llave = await abrir(f.sobre, kek);
      paso = "datos"; await abrirDatos();
      S.pantalla = "nueva"; pintar();
    } catch (e) {
      // el detalle (paso y error) es para que Alain sepa qué ha pasado
      const det = " [" + paso + ": " + (e && (e.name + " " + e.message) || e) + "]";
      S.error = String(e && e.message) === "red" || paso === "descargar" ? "No he podido conectar para traer tus datos. Mira que tienes internet y prueba otra vez." + det : "No he podido abrir tus datos. Pregúntale a Alain." + det;
      S.pantalla = "entrar"; pintar();
    }
  };
}
const OJO='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OJO_NO='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.8 10.8 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.1-5.9M9.9 5.2A10 10 0 0 1 12 5c7 0 11 7 11 7a19.6 19.6 0 0 1-2.4 3.4M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>';
function ojos() {
  document.querySelectorAll('.form input[type=password]').forEach(i => {
    const w = document.createElement("div"); w.className = "pw"; i.parentNode.insertBefore(w, i); w.appendChild(i);
    const b = document.createElement("button"); b.type = "button"; b.className = "ojo"; b.innerHTML = OJO; b.setAttribute("aria-label", "Ver contraseña");
    b.onclick = () => { const ver = i.type === "password"; i.type = ver ? "text" : "password"; b.innerHTML = ver ? OJO_NO : OJO; b.setAttribute("aria-label", ver ? "Ocultar contraseña" : "Ver contraseña"); };
    w.appendChild(b);
  });
}
function espera(t) { $app.innerHTML = `<div class="cargando">${esc(t)}</div>`; }
function pintarClave() {
  $app.innerHTML = `<div class="portada" style="padding-bottom:28px"><h1>Tu contraseña</h1></div>
<form class="form" id="f"><div class="card" style="gap:12px">

// el sobre con la contraseña nueva va al buzón (y se reintenta si no había conexión)
async function enviarBuzon(pend) {
  const sobreTxt = JSON.stringify(pend.sobre);
  const prueba = b64.a(await hmac(S.llave.slice(32, 64), enc.encode("buzon|" + S.id + "|" + pend.sal + "|" + pend.iter + "|" + sobreTxt)));
  const cuerpo = new URLSearchParams({ "form-name": "buzon", id: S.id, sal: pend.sal, iter: String(pend.iter), sobre: sobreTxt, prueba });
  try {
    // el buzón está en otra dirección (Netlify): se manda como un formulario normal; la respuesta no se puede leer
    const r = await fetch(BUZON || "./", { method: "POST", mode: BUZON ? "no-cors" : "cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: cuerpo.toString() });
    if (r.ok || r.type === "opaque") { pend.enviado = hoyTxt(); ls.set("gd_pendiente_" + S.id, pend); }
  } catch (e) {}
}

async function avisarUso() {

    if (!S.llave || !S.id || !S.datos || S.datos.admin) return;
    const ahora = Date.now(), ult = ls.get("gd_uso_" + S.id) || 0; if (ahora - ult < 30 * 60 * 1000) return;
    const d = new Date(), dd = x => String(x).padStart(2, "0");

    const prueba = b64.a(await hmac(S.llave.slice(32, 64), enc.encode("uso|" + S.id + "|" + sobre)));

// ---------- avisos al móvil (31/10/2026) ----------
// El PC manda los avisos; aquí solo se activan: el móvil da su «dirección de avisos» y se la pasamos a Alain por el buzón,
// firmada con la llave de la cuenta (como la contraseña). S.datos.push = { k: clave pública del PC, on: puede activarlos }
const b64u = { de(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return b64.de(s); } };
const pushPosible = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
async function mandarPush(o) {
  const sobre = JSON.stringify(o);
  const prueba = b64.a(await hmac(S.llave.slice(32, 64), enc.encode("push|" + S.id + "|" + sobre)));
  const cuerpo = new URLSearchParams({ "form-name": "buzon", id: S.id, sal: "push", iter: "0", sobre, prueba });
  const r = await fetch(BUZON || "./", { method: "POST", mode: BUZON ? "no-cors" : "cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: cuerpo.toString() });
  if (!(r.ok || r.type === "opaque")) throw new Error("no se ha podido avisar a Alain (" + r.status + ")");
}
async function activarAvisos() {
  S.avMsg = "";
  try {
    const perm = await Notification.requestPermission();   // lo primero: el iPhone solo lo pregunta justo al pulsar
    if (perm !== "granted") { S.avMsg = perm === "denied" ? "Has dicho que no. Para activarlos, permite las notificaciones de esta app en los ajustes del móvil." : ""; pintar(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    const clave = b64u.de(S.datos.push.k);
    if (sub && sub.options && sub.options.applicationServerKey) { const a = new Uint8Array(sub.options.applicationServerKey); if (a.length !== clave.length || a.some((x, i) => x !== clave[i])) { await sub.unsubscribe(); sub = null; } }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: clave });
    const j = sub.toJSON();
    await mandarPush({ e: j.endpoint, p: j.keys.p256dh, a: j.keys.auth, q: "alta" });
    ls.set("gd_push_" + S.id, j.endpoint); S.avMsg = ""; S.avListo = true;
  } catch (e) { S.avMsg = "No se han podido activar: " + (e && e.message ? e.message : e); }
  pintar();
}
async function quitarAvisos() {
  S.avMsg = "";
  try {
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    const e = sub ? sub.endpoint : ls.get("gd_push_" + S.id);
    if (sub) await sub.unsubscribe();
    if (e) await mandarPush({ e, q: "baja" });
    ls.del("gd_push_" + S.id); ls.del("gd_avisos_" + S.id); S.avMsg = "";
  } catch (x) { S.avMsg = "No se han podido quitar: " + (x && x.message ? x.message : x); }
  pintar();
}

function misAvisos() {
  const P = S.datos.push, l = ls.get("gd_avisos_" + S.id) || P.mis;

function hojaCampana(previa) {

  h += `</main><nav class="nav" style="grid-template-columns:repeat(${pestanas.length},1fr)">` + pestanas.map(n => `<button data-tab="${n}" class="${n === tab ? "on" : ""}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg><span>${n}</span></button>`).join("") + `</nav>`;
  $app.innerHTML = h;
  $app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; contarPest(S.tab); pintar(); window.scrollTo(0, 0); });
  $app.querySelectorAll("[data-per]").forEach(b => b.onclick = () => { S.per = b.dataset.per; pintar(); });
  $app.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { S.per = b.dataset.ver; S.tab = "Clases"; pintar(); window.scrollTo(0, 0); });
  const sal = document.getElementById("salir"); if (sal) sal.onclick = ev => { ev.preventDefault(); salir(); };
  $app.querySelectorAll("[data-evo]").forEach(b => b.onclick = () => { S.tab = "Evolucion"; S.evoSel = null; contarPest("Evolución"); pintar(); window.scrollTo(0, 0); });
  $app.querySelectorAll("[data-evoper]").forEach(b => b.onclick = () => { S.evoPer = b.dataset.evoper; S.evoSel = null; S.per = "Todos"; pintar(); });
  $app.querySelectorAll("[data-evosel]").forEach(b => b.onclick = () => { S.evoSel = +b.dataset.evosel; pintar(); });
  $app.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => { S.mesAb = S.mesAb === b.dataset.mes ? null : b.dataset.mes; pintar(); });
  const sc = document.getElementById("selcurso"); if (sc) sc.onchange = () => { S.ci = +sc.value; S.mesAb = null; contarPest("Cursos anteriores"); pintar(); window.scrollTo(0, 0); };
  const vol = document.getElementById("volver"); if (vol) vol.onclick = () => { S.ci = 0; S.mesAb = null; S.cuenta = -1; S.tab = "Inicio"; S.per = "Todos"; pintar(); window.scrollTo(0, 0); };
  const ins = document.getElementById("instalar"); if (ins) ins.onclick = ev => { ev.preventDefault(); verInstalar(true); };
  enlazarAvisos();
}
// vista de Alain: la lista de todas las cuentas; al pulsar una, se ve exactamente como la ve el alumno
function pintarAdmin() {
  const L = S.datos.cuentas;
  $app.innerHTML = `<header class="cab"><div class="fila"><div style="flex-grow:1"><h1>Todos los alumnos</h1><div class="sub">Vista de ${esc(S.datos.saludo)} · actualizado el ${esc(S.datos.actualizado)}</div></div>${avisosActivos() ? botonCampana(false) : ""}<button class="salir" id="salir">Cerrar sesión</button></div></header>
<main class="cuerpo" style="padding-bottom:24px">${bloqueAvisos()}<div class="card" style="gap:0"><div class="tit" style="padding-bottom:4px">${L.length} CUENTAS · PULSA PARA VER LO QUE VE CADA UNO</div>`
    + L.map((c, i) => { const a = agg(c, c.personas, c.personas.length > 1); const debe = c.pagos.pend.length > 0;
      return `<button class="persona" data-cuenta="${i}"><span style="flex-grow:1"><span style="display:block;font-size:16px;font-weight:650">${esc(c.titulo)}</span><span class="gris" style="font-size:12.5px">${esc(c.etiqueta || "")}</span></span><span class="chip ${debe ? "c-debe" : "c-rec"}">${debe ? esc(c.pagos.debe) : "al día"}</span><span style="font-size:16px;font-weight:750;color:#1D4F78;width:52px;text-align:right">${pct(a.dadas, a.netas)}</span></button>`; }).join("")
    + `</div>${esApp() ? "" : `<a href="#" id="instalar" style="text-align:center;font-size:14px;font-weight:600;padding:6px">Ponerla como app en el móvil</a>`}</main>`;
  $app.querySelectorAll("[data-cuenta]").forEach(b => b.onclick = () => { S.ci = 0; S.mesAb = null; S.cuenta = +b.dataset.cuenta; S.tab = "Inicio"; S.per = "Todos"; pintar(); window.scrollTo(0, 0); });
  document.getElementById("salir").onclick = ev => { ev.preventDefault(); salir(); };
  const ins = document.getElementById("instalar"); if (ins) ins.onclick = ev => { ev.preventDefault(); verInstalar(true); };
  enlazarAvisos();
}
function salir() {
  const capa = document.createElement("div"); capa.className = "capa";
  capa.innerHTML = `<div class="hoja"><div style="font-size:20px;font-weight:700">¿Cerrar sesión?</div><div class="gris" style="font-size:15px;line-height:1.45">Solo hace falta si este móvil no es tuyo. Para cerrar la app, ciérrala como cualquier otra: la próxima vez entrarás directamente. Si cierras la sesión, tendrás que escribir otra vez tu contraseña.</div><button class="boton" id="siSalir">Cerrar sesión</button><button class="boton2" id="noSalir">Cancelar</button></div>`;
  document.body.appendChild(capa);
  const quitar = () => capa.remove();
  capa.onclick = e => { if (e.target === capa) quitar(); };
  document.getElementById("noSalir").onclick = quitar;
  document.getElementById("siSalir").onclick = () => {
    quitar(); ls.del("gd_sesion");
    const id = S.id, ficha = S.ficha, conClave = !!(ficha && (ficha.modo === "clave" || ls.get("gd_pendiente_" + id)));
    S = { pantalla: conClave ? "clave" : "entrar", tab: "Inicio", per: "Todos", ficha: conClave ? ficha : null, id: conClave ? id : null, llave: null, datos: null, cuenta: -1, error: "" };
    pintar();
  };
}
function pintar() {
  if (S.pantalla === "entrar") pintarEntrar(); else if (S.pantalla === "clave") pintarClave(); else if (S.pantalla === "nueva") pintarNueva(); else pintarApp();
  if (S.pantalla === "app" && !ls.get("gd_instalar_visto") && !esApp()) { ls.set("gd_instalar_visto", 1); setTimeout(() => verInstalar(false), 600); }
}

// ---------- ponerla como app ----------
let avisoInstalar = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); avisoInstalar = e; });
const esApp = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const esIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function verInstalar(pedido) {
  if (esApp()) return;
  const ios = esIOS();
  if (!ios && !avisoInstalar && !pedido) return;
  const capa = document.createElement("div"); capa.className = "capa";
  const flecha = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4F78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="icono Compartir" style="vertical-align:-4px"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>`;
  capa.innerHTML = `<div class="hoja"><div style="font-size:20px;font-weight:700">Ponla como app</div><div class="gris" style="font-size:14px">Así la tienes en la pantalla de inicio, con su icono.</div>`
    + (ios ? `<div class="paso"><b class="num">1</b><div>Abajo, en Safari, pulsa <b>Compartir</b> ${flecha}</div></div><div class="paso"><b class="num">2</b><div>Baja y pulsa <b>«Añadir a pantalla de inicio»</b></div></div><div class="paso"><b class="num">3</b><div>Pulsa <b>«Añadir»</b> arriba a la derecha. Ya está.</div></div>`
      : avisoInstalar ? `<button class="boton" id="inst" style="background:#2F7D4F">Instalar</button>` : `<div class="paso"><b class="num">1</b><div>Abre el menú del navegador (los tres puntos) y pulsa <b>«Instalar aplicación»</b> o <b>«Añadir a pantalla de inicio»</b>.</div></div>`)
    + `<button class="boton2" id="cerrarI">Ahora no</button></div>`;
  document.body.appendChild(capa);
  const quitar = () => capa.remove();
  capa.onclick = e => { if (e.target === capa) quitar(); };
  document.getElementById("cerrarI").onclick = quitar;
  const bi = document.getElementById("inst"); if (bi) bi.onclick = async () => { avisoInstalar.prompt(); try { await avisoInstalar.userChoice; } catch (e) {} avisoInstalar = null; quitar(); };
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
inicio();
</script>
